name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/free-guard-access-20261125, feat/free-guard-pricing-transition-20261125, feat/guest-booking-availability-20261125, fix/job-posted-email-acceptance-20261125, fix/signup-verification-delivery-20261125, fix/admin-payment-test-mfa-20261125, feat/sandbox-activation-callback-isolation-20261125]

concurrency:
  group: quickguard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repository lint
        run: npm run lint

      - name: TypeScript check
        id: typescript
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload TypeScript report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-report
          path: tsc-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Admin and financial type gate
        run: npm run check:admin

      - name: Guest booking Edge type gate
        run: node scripts/checks/guest-booking-typecheck.cjs

      - name: Financial regression tests
        run: npm run test:unit

      - name: Next build
        # Validation output is never deployed. Override the tracked public settings
        # so prerendering uses a local placeholder rather than production Supabase.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: quickguard-build-placeholder
        run: npm run build

      - name: Install Chromium for isolated free-access smoke
        run: npx playwright install --with-deps chromium

      - name: Browser free-access smoke with synthetic API only
        shell: bash
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:9
          NEXT_PUBLIC_SUPABASE_ANON_KEY: quickguard-build-placeholder
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
        run: |
          npx next start -H 127.0.0.1 -p 3100 > /tmp/quickguard-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/uat/free-guard-browser-smoke.cjs
          node scripts/uat/guard-pricing-browser-smoke.cjs
          node scripts/uat/guest-booking-browser-smoke.cjs
          node scripts/uat/signup-delivery-browser-smoke.cjs
          node scripts/uat/public-job-query-browser-smoke.cjs

      - name: Upload free-access browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-guard-browser-smoke
          path: |
            uat-results/free-guard-access/
            uat-results/guest-booking/
            uat-results/signup-delivery/
          if-no-files-found: ignore
          retention-days: 7
