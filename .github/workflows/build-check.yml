name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quickguard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        id: typescript
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload TypeScript report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-report
          path: tsc-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Summarize TypeScript debt
        if: steps.typescript.outputs.exit_code != '0'
        run: echo "TypeScript debt remains; see typescript-report artifact. Production build will still be validated."

      - name: Admin and financial type gate
        run: npm run check:admin

      - name: Financial regression tests
        run: npm run test:unit

      - name: Next build
        run: npm run build
