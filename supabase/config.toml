[functions.create-subscription-checkout]
# Authentication is enforced inside the function with auth.getUser().
# Keeping the legacy gateway verifier enabled rejects valid sessions signed
# with the project's current signing keys before the function can validate them.
verify_jwt = false

[functions.admin-login]
# This pre-authentication endpoint validates credentials, rate-limits failures,
# verifies the active admin record, and records the login attempt internally.
verify_jwt = false

[functions.create-job]
# The function validates the bearer token with auth.getUser() and verifies that
# the submitted client belongs to that authenticated user.
verify_jwt = false

[functions.create-job-payment]
verify_jwt = true

[functions.create-guard-payout]
verify_jwt = true

[functions.process-overdue-guard-payouts]
# pg_cron authenticates with a generated Vault token validated inside the function.
verify_jwt = false

[functions.release-guard-payment]
verify_jwt = true

[functions.enhanced-stripe-webhook]
verify_jwt = false

[functions.stripe-bank-payout-webhook]
# Validates Stripe Connect signatures using service-only signing keys.
verify_jwt = false

[functions.sync-guard-bank-payouts]
# Validates the caller via auth.getUser and verifies guard/finance ownership.
verify_jwt = false

[functions.approve-job-completion]
verify_jwt = true

[functions.dfp-support-ticket-bridge]
verify_jwt = true

[functions.receive-dfp-support-reply]
verify_jwt = false

[functions.dfp-support-message-bridge]
verify_jwt = true

[functions.update-after-payment]
verify_jwt = true

[functions.account-closure]
# The handler validates the user token, ownership, and admin MFA where needed.
verify_jwt = false

[functions.admin-delete-user]
# Auth.getUser verifies the caller before parsing; active super_admin and AAL2 required.
verify_jwt = false

[functions.process-account-retention]
# Authenticated by a generated Vault scheduler token, never a browser flag.
verify_jwt = false

[functions.complete-guard-profile]
# The function validates the bearer token with auth.getUser().
verify_jwt = false

[functions.client-attendance-issue]
# Validates the bearer token, open account, client/job ownership and assignment.
verify_jwt = false

[functions.submit-replacement-request]
# Validates the bearer token; a service-only transaction checks ownership and closure.
verify_jwt = false

[functions.get-client-job-history]
# Validates auth.getUser(), account closure and client ownership inside the handler.
verify_jwt = false

[functions.get-client-assigned-guards]
# Validates auth.getUser(), account closure, job ownership and actual assignments.
verify_jwt = false

[functions.get-client-payment-method-status]
# Read only; also checks auth.getUser(), account closure and owned client bindings.
verify_jwt = true
[functions.manage-client-documents]
# Auth.getUser verifies the bearer in-handler, supporting current signing keys.
verify_jwt = false

# Manual cleanup verifies the signed-in admin and MFA before any request.
[functions.admin-run-cleanup]
verify_jwt = true

# The handler verifies the bearer token, active admin MFA and content role.
[functions.stage-site-media]
verify_jwt = false

# In-handler active admin and MFA checks.
[functions.publish-site-media]
verify_jwt = false

# Deliberately public; only current published versions can be read.
[functions.public-site-media]
verify_jwt = false

# Private version retrieval verifies user, active admin MFA and content role.
[functions.admin-read-site-media]
verify_jwt = false
