[functions.create-subscription-checkout]
# Authentication is enforced inside the function with auth.getUser().
# Keeping the legacy gateway verifier enabled rejects valid sessions signed
# with the project's current signing keys before the function can validate them.
verify_jwt = false

[functions.admin-login]
# This pre-authentication endpoint validates credentials, rate-limits failures,
# verifies the active admin record, and records the login attempt internally.
verify_jwt = false

[functions.create-job]
# The function validates the bearer token with auth.getUser() and verifies that
# the submitted client belongs to that authenticated user.
verify_jwt = false

[functions.create-job-payment]
verify_jwt = true

[functions.create-guard-payout]
verify_jwt = true

[functions.process-overdue-guard-payouts]
# pg_cron authenticates with a generated Vault token validated inside the function.
verify_jwt = false

[functions.release-guard-payment]
verify_jwt = true

[functions.enhanced-stripe-webhook]
verify_jwt = false

[functions.stripe-bank-payout-webhook]
# Validates Stripe Connect signatures using service-only signing keys.
verify_jwt = false

[functions.sync-guard-bank-payouts]
# Validates the caller via auth.getUser and verifies guard/finance ownership.
verify_jwt = false

[functions.approve-job-completion]
verify_jwt = true

[functions.dfp-support-ticket-bridge]
verify_jwt = true

[functions.receive-dfp-support-reply]
verify_jwt = false

[functions.dfp-support-message-bridge]
verify_jwt = true

[functions.update-after-payment]
verify_jwt = true
